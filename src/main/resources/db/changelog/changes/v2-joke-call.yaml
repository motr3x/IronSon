databaseChangeLog:
  - changeSet:
      id: 2
      author: your_name
      changes:
        - createSequence:
            sequenceName: joke_call_sequence
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: joke_call
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
              - column:
                  name: call_time
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: joke_id
                  type: bigint
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: joke_call
            baseColumnNames: joke_id
            constraintName: fk_joke_call_joke
            referencedTableName: joke
            referencedColumnNames: id